<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Court Marriage Guwahati</title>
    <meta name="robots" content="noindex, nofollow">

    <link rel="icon" type="image/svg+xml" href="../images/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body class="login-page">

    <!-- Animated Background Grid -->
    <div class="login-grid-bg"></div>

    <!-- Floating Particles -->
    <canvas id="loginParticles" style="position:absolute;inset:0;pointer-events:none;z-index:0;"></canvas>

    <div class="login-card" id="loginCard">
        <!-- Logo Area -->
        <div class="login-logo">
            <div class="login-logo-icon">
                <i class="fa-solid fa-scale-balanced"></i>
            </div>
            <h1>Admin Portal</h1>
            <p>Court Marriage Guwahati — Secure Access</p>
        </div>

        <!-- Login Form -->
        <form id="adminLoginForm" autocomplete="off" novalidate>
            <div class="login-form-group">
                <label for="adminUsername">Username</label>
                <div class="login-input-wrap">
                    <i class="fa-solid fa-user input-icon"></i>
                    <input type="text" id="adminUsername" name="username" placeholder="Enter admin username" autocomplete="username" required>
                </div>
            </div>

            <div class="login-form-group">
                <label for="adminPassword">Password</label>
                <div class="login-input-wrap">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="adminPassword" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                    <button type="button" class="toggle-password" id="togglePasswordBtn" aria-label="Toggle password visibility">
                        <i class="fa-solid fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <!-- Security Notice -->
            <div style="margin-bottom:20px; padding:12px 14px; background:rgba(197,155,39,0.07); border:1px solid rgba(197,155,39,0.18); border-radius:8px; font-size:12px; color:#94a3b8; display:flex; gap:8px; align-items:flex-start;">
                <i class="fa-solid fa-shield-halved" style="color:#c59b27; margin-top:1px; flex-shrink:0;"></i>
                <span>This is a restricted admin area. Unauthorized access is prohibited. All activity is logged.</span>
            </div>

            <button type="submit" class="login-btn" id="loginSubmitBtn">
                <i class="fa-solid fa-right-to-bracket"></i>
                Sign In to Dashboard
            </button>

            <div class="login-error" id="loginError">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="loginErrorText">Invalid credentials. Please try again.</span>
            </div>
        </form>

        <div class="login-footer">
            <p>🔒 Secured with end-to-end encryption</p>
            <p style="margin-top:8px;">
                <a href="../index.html"><i class="fa-solid fa-arrow-left"></i> Return to Website</a>
            </p>
        </div>
    </div>

    <script>
    // ── Particle Canvas Background ───────────────────────────────────────────
    (function() {
        const canvas = document.getElementById('loginParticles');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let raf;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function createParticle() {
            return {
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                r: Math.random() * 1.5 + 0.3,
                dx: (Math.random() - 0.5) * 0.4,
                dy: -(Math.random() * 0.5 + 0.2),
                opacity: Math.random() * 0.5 + 0.1,
                color: Math.random() > 0.6 ? '#c59b27' : '#3b82f6'
            };
        }

        function init() {
            resize();
            particles = Array.from({ length: 80 }, createParticle);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, i) => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.opacity;
                ctx.fill();
                ctx.globalAlpha = 1;

                p.x += p.dx;
                p.y += p.dy;

                if (p.y < -10) {
                    particles[i] = { ...createParticle(), y: canvas.height + 10 };
                }
            });
            raf = requestAnimationFrame(draw);
        }

        init();
        draw();
        window.addEventListener('resize', init);
    })();

    // ── Login Logic ───────────────────────────────────────────────────────────
    const ADMIN_CREDENTIALS = {
        username: 'admin',
        password: 'CMGuwahati@2024'
    };

    const form = document.getElementById('adminLoginForm');
    const errorEl = document.getElementById('loginError');
    const errorText = document.getElementById('loginErrorText');
    const submitBtn = document.getElementById('loginSubmitBtn');
    const togglePwBtn = document.getElementById('togglePasswordBtn');
    const eyeIcon = document.getElementById('eyeIcon');
    const pwInput = document.getElementById('adminPassword');

    // Auto-redirect if already logged in
    if (sessionStorage.getItem('cmg_admin_auth') === 'true') {
        window.location.href = 'dashboard.html';
    }

    togglePwBtn.addEventListener('click', () => {
        const isText = pwInput.type === 'text';
        pwInput.type = isText ? 'password' : 'text';
        eyeIcon.className = isText ? 'fa-solid fa-eye' : 'fa-solid fa-eye-slash';
    });

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        const user = document.getElementById('adminUsername').value.trim();
        const pass = pwInput.value;

        errorEl.classList.remove('show');
        submitBtn.classList.add('loading');
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner spin"></i> Authenticating...';

        // Simulated auth check with delay
        setTimeout(() => {
            if (user === ADMIN_CREDENTIALS.username && pass === ADMIN_CREDENTIALS.password) {
                sessionStorage.setItem('cmg_admin_auth', 'true');
                sessionStorage.setItem('cmg_admin_user', user);
                submitBtn.innerHTML = '<i class="fa-solid fa-check"></i> Access Granted!';
                submitBtn.style.background = 'linear-gradient(135deg,#166534,#22c55e)';
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 800);
            } else {
                submitBtn.classList.remove('loading');
                submitBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign In to Dashboard';
                errorText.textContent = 'Invalid username or password. Please try again.';
                errorEl.classList.add('show');
                document.getElementById('adminPassword').value = '';
                // Shake animation
                document.getElementById('loginCard').style.animation = 'none';
                setTimeout(() => {
                    document.getElementById('loginCard').style.animation = 'shake 0.4s ease';
                }, 10);
            }
        }, 1200);
    });

    // Add shake animation style
    const style = document.createElement('style');
    style.textContent = `
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(5px); }
        }
    `;
    document.head.appendChild(style);
    </script>
</body>
</html>
